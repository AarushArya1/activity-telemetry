[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workflow-recon"
version = "0.1.0"
description = "Reconstruct workflows from ActivityWatch telemetry (sequence mining + LLM inference)"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.1",
  "pyarrow>=14",
  "pydantic>=2.5",
  "pyyaml>=6",
  "google-genai>=1.30",
]

[project.optional-dependencies]
anthropic = ["anthropic>=2.0"]
mining = ["pm4py>=2.7"]
app = ["streamlit>=1.40", "altair>=5"]
presidio = ["presidio-analyzer>=2.2", "presidio-anonymizer>=2.2"]
dev = ["pytest>=8", "anthropic>=2.0", "streamlit>=1.40", "altair>=5"]

[project.scripts]
workflow-recon = "workflow_recon.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
